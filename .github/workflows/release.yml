# Builds Hamzaban for Windows, macOS and Linux and publishes a GitHub Release.
# Runs when a version tag is pushed (git tag v0.1.0 && git push origin v0.1.0),
# or by hand from the Actions tab, which builds without publishing.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            # A second, ARM-only installer.
            extra: --win nsis --arm64
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Package
        run: pnpm exec electron-builder ${{ matrix.target }} --publish never
        env:
          # No signing certificates yet; do not look for any on the runner.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Package (extra)
        if: matrix.extra
        run: pnpm exec electron-builder ${{ matrix.extra }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: hamzaban-${{ matrix.os }}
          if-no-files-found: error
          path: |
            release/*/*.exe
            release/*/*.dmg
            release/*/*.AppImage
            release/*/*.deb

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: Hamzaban ${{ github.ref_name }}
          body_path: .github/release-notes.md
          generate_release_notes: true
          files: dist-release/**/*
